# Builds Karen for macOS, Linux and Windows.
# Pushing a tag vX.Y.Z (matching the version in src-tauri/tauri.conf.json) creates a draft
# GitHub release, uploads every installer to it, and publishes it once all builds pass.
# Running the workflow by hand builds the same installers as workflow artifacts, without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web

  create-release:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Karen ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
              generate_release_notes: true,
            })
            return data.id

  build:
    needs: [check, create-release]
    # create-release is skipped for manual runs; build anyway as long as nothing failed
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          # oldest supported Ubuntu runner, so the .deb/AppImage work on older glibc
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file patchelf pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # Tauri signs and notarizes when these variables are set, but treats an empty one (an unset
      # secret) as set, so only export the ones that have a value. Tag builds must be signed and
      # notarized; manual runs without the secrets fall back to an ad-hoc signature.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fail_or_adhoc() {
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1; using an ad-hoc signature, the app will not be notarized"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          }
          export_var() {
            [[ -n "${!1}" ]] || return 0
            { echo "$1<<__KAREN_EOF__"; echo "${!1}"; echo "__KAREN_EOF__"; } >> "$GITHUB_ENV"
          }

          [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" ]] \
            || fail_or_adhoc "APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD secrets are not set"
          export_var APPLE_CERTIFICATE
          export_var APPLE_CERTIFICATE_PASSWORD
          export_var APPLE_SIGNING_IDENTITY

          if [[ -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_P8" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            export_var APPLE_API_ISSUER
            export_var APPLE_API_KEY
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          elif [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            export_var APPLE_ID
            export_var APPLE_PASSWORD
            export_var APPLE_TEAM_ID
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "::error::no notarization credentials (APPLE_API_* or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)"
            exit 1
          else
            echo "::warning::no notarization credentials; the app is signed but not notarized"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: karen-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.id }},
              draft: false,
            })
