# Builds Karen for macOS, Linux and Windows.
# Pushing a tag vX.Y.Z (matching the version in src-tauri/tauri.conf.json) creates a draft
# GitHub release, uploads every installer to it, and publishes it once all builds pass.
# Release builds are signed for the in-app updater (TAURI_SIGNING_PRIVATE_KEY secret) and the release gets the
# latest.json manifest the updater reads.
# Running the workflow by hand builds the same installers as workflow artifacts, without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web

  create-release:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Karen ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
              generate_release_notes: true,
              // prepended to the generated notes
              body: [
                '## Installing on macOS',
                'Karen is not notarized by Apple, so macOS blocks it the first time with "Karen cannot be opened" or "Karen is damaged". After moving Karen to Applications, either:',
                '- run `xattr -dr com.apple.quarantine /Applications/Karen.app` in Terminal, or',
                '- open Karen once, then go to System Settings → Privacy & Security and click **Open Anyway**.',
                '',
                'Download the `aarch64` dmg for Apple Silicon Macs and the `x64` dmg for Intel Macs.',
              ].join('\n'),
            })
            return data.id

  build:
    needs: [check, create-release]
    # create-release is skipped for manual runs; build anyway as long as nothing failed
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          # oldest supported Ubuntu runner, so the .deb/AppImage work on older glibc
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file patchelf pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # Without a paid Apple Developer account the app gets an ad-hoc signature and is not notarized.
      # Adding the APPLE_* secrets later switches to Developer ID signing and notarization. Tauri treats
      # an empty variable (an unset secret) as set, so only export the ones that have a value.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_var() {
            [[ -n "${!1}" ]] || return 0
            { echo "$1<<__KAREN_EOF__"; echo "${!1}"; echo "__KAREN_EOF__"; } >> "$GITHUB_ENV"
          }

          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "No Developer ID certificate: ad-hoc signing, not notarized"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          export_var APPLE_CERTIFICATE
          export_var APPLE_CERTIFICATE_PASSWORD
          export_var APPLE_SIGNING_IDENTITY

          if [[ -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_P8" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            export_var APPLE_API_ISSUER
            export_var APPLE_API_KEY
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          elif [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            export_var APPLE_ID
            export_var APPLE_PASSWORD
            export_var APPLE_TEAM_ID
          else
            echo "::warning::no notarization credentials; the app is signed but not notarized"
          fi

      # The updater only installs packages signed with the key whose public half is in tauri.conf.json. Releases
      # must be signed; a manual run without the secret builds the installers without updater signatures.
      - name: Configure updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is not set; releases must be signed for the updater"
              exit 1
            fi
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY secret: building without updater artifacts"
            exit 0
          fi
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            { echo "$name<<__KAREN_EOF__"; echo "${!name}"; echo "__KAREN_EOF__"; } >> "$GITHUB_ENV"
          done
          # merged into tauri.conf.json here only, so local builds need no key
          echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ env.UPDATER_ARGS }}
          # the publish job writes latest.json once every build is in (parallel jobs would race to update it)
          includeUpdaterJson: false

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: karen-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upload updater manifest
        uses: actions/github-script@v8
        with:
          script: |
            const { buildManifest, releaseNotes } = require('./scripts/updater-manifest.cjs')
            const { owner, repo } = context.repo
            const release_id = ${{ needs.create-release.outputs.id }}
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id })
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 })

            const signatures = {}
            for (const asset of assets.filter((a) => a.name.endsWith('.sig'))) {
              const { data } = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
              })
              signatures[asset.name.slice(0, -'.sig'.length)] = Buffer.from(data).toString('utf8')
            }

            // a draft's asset URLs point at an "untagged" path; these are the ones it gets once published
            const tag = release.tag_name
            const manifest = buildManifest({
              version: tag.replace(/^v/, ''),
              notes: releaseNotes(release.body),
              pubDate: new Date().toISOString(),
              assets: assets.map((a) => a.name),
              signatures,
              url: (name) => `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(name)}`,
            })
            core.info(JSON.stringify(manifest, null, 2))

            const old = assets.find((a) => a.name === 'latest.json')
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id })
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
              headers: { 'content-type': 'application/json' },
            })

      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.id }},
              draft: false,
            })
