<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Git Graph</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg class="avatar-defs" width="0" height="0" aria-hidden="true">
      <defs id="avatar-defs">
        <clipPath id="avatar-clip" clipPathUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.5" /></clipPath>
      </defs>
    </svg>
    <header class="bar">
      <div class="repo" id="repo">
        <span class="repo-name" id="repo-name">Git Graph</span>
        <span class="repo-branch" id="repo-branch"></span>
      </div>
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <div class="search">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search message, sha, author, ref" spellcheck="false" autocomplete="off" />
      <span class="search-count" id="search-count"></span>
    </div>
    <main class="graph" id="graph">
      <div class="scroll" id="scroll" tabindex="0" aria-label="Commits">
        <div class="spacer" id="spacer"><div class="rows" id="rows"></div></div>
      </div>
      <div class="state" id="state" hidden></div>
    </main>
    <div class="splitter" id="splitter" hidden></div>
    <section class="details" id="details" hidden></section>
    <script type="module" src="app.js"></script>
  </body>
</html>
